[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptafind"
version = "0.1.0"
description = "Reproducible aptamer data profiling and modeling research pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "rapidfuzz",
  "rdkit",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
