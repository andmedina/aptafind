manifest_version: "0.2.0"
last_reviewed: "2026-08-27"
project_scope: "Experimentally grounded ssDNA aptamers for small-molecule targets, with steroid-focused transfer and evaluation"

storage_policy:
  tracked_in_git:
    - source_metadata
    - provenance
    - rights_and_access_notes
    - file_inventories
    - checksums
    - acquisition_instructions
  local_only:
    root: data_lake
    bronze: immutable_source_snapshots
    silver: validated_standardized_records
    gold: model_ready_versioned_datasets
  remote_only_until_approved:
    - multi_gigabyte_sequencing_files
    - request_only_data
    - sources_with_unresolved_reuse_terms

status_vocabulary:
  - discovered
  - metadata_verified
  - downloaded
  - profiled
  - approved_for_analysis
  - approved_for_redistribution

evidence_vocabulary:
  - measured_affinity
  - measured_binding
  - measured_nonbinding
  - measured_cross_reactivity
  - counter_selection
  - multi_round_enrichment
  - late_round_abundance
  - published_candidate
  - library_composition

source_role_vocabulary:
  - endpoint_aggregate
  - primary_endpoint_study
  - selection_trajectory
  - discovery_index
  - derived_overlap_audit
  - supporting_control

