exclusions:
  - exclusion_id: steroid_receptor_selex
    reason: "Measures DNA recognition by steroid receptor proteins, not aptamer binding to steroid molecules."
  - exclusion_id: aptani_islet_ht_selex
    reason: "Complex cellular targets are outside the ssDNA-small-molecule scope."
  - exclusion_id: rna_only_aptamer_sources
    examples:
      - RiboaptDB
      - Ribocentre_RNA_records
      - R_BIND
      - UltraSynBERT_RNA_SELEX_tasks
    reason: "RNA aptamers are a different molecular alphabet and folding regime; do not convert RNA sequences to DNA."
  - exclusion_id: natural_rna_small_molecule_interactions
    examples:
      - NALDB
      - SMRTnet
    reason: "These sources study small molecules binding natural RNAs rather than selected ssDNA aptamers."
  - exclusion_id: protein_peptide_cell_and_tissue_targets
    reason: "Useful for generic nucleic-acid modeling but outside the target-conditioned small-molecule endpoint task."
  - exclusion_id: ions_as_primary_targets
    reason: "Metal and inorganic-ion coordination differs from organic small-molecule recognition; track separately if the scope expands."
  - exclusion_id: chemically_modified_x_aptamers
    reason: "Modified bases cannot be represented faithfully by the current A/C/G/T tokenizer; retain only as a clearly flagged external evaluation source."
  - exclusion_id: random_cross_pair_negatives_as_measured_evidence
    reason: "Unobserved aptamer-target pairs are unlabeled, not experimentally measured nonbinders."
